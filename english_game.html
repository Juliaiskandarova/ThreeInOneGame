<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>English Snake Game</title>
  <!-- Скрипт Telegram WebApp (для работы внутри Telegram) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .score-board {
      font-size: 20px;
      margin-bottom: 10px;
      color: #333;
    }
    #gameCanvas {
      background: #fff;
      border: 2px solid #ccc;
      border-radius: 8px;
    }
    /* Стили для модального окна */
    .modal-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    .modal-content h2 {
      margin-bottom: 15px;
    }
    .modal-content .question-text {
      font-size: 16px;
      margin-bottom: 15px;
      min-height: 50px;
    }
    .modal-content input[type="text"] {
      width: 80%;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .modal-content .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .modal-content button {
      cursor: pointer;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      background: #007bff;
      color: #fff;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .modal-content button:hover {
      background: #0056b3;
    }
    .modal-content .result-message {
      margin-top: 10px;
      min-height: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="score-board" id="scoreBoard">Score: 0</div>
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <!-- Модальное окно для вопросов -->
  <div class="modal-background" id="modalBg">
    <div class="modal-content">
      <h2>Answer the question</h2>
      <div class="question-text" id="questionText"></div>
      <input type="text" id="userAnswer" placeholder="Ваш ответ">
      <div class="result-message" id="resultMessage"></div>
      <div class="buttons">
        <button id="checkBtn">Check</button>
        <button id="closeBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Элементы страницы
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBoard = document.getElementById('scoreBoard');
    const modalBg = document.getElementById('modalBg');
    const questionText = document.getElementById('questionText');
    const userAnswer = document.getElementById('userAnswer');
    const resultMessage = document.getElementById('resultMessage');
    const checkBtn = document.getElementById('checkBtn');
    const closeBtn = document.getElementById('closeBtn');

    // Настройки игры
    const cellSize = 20;         // Размер одной клетки (используется для змейки)
    let gameSpeed = 150;         // Интервал движения змейки в мс

    // Инициализация змейки (координаты задаются в "клетках")
    let snake = [
      {x: 5, y: 5},
      {x: 4, y: 5},
      {x: 3, y: 5}
    ];
    let direction = {x: 1, y: 0};     // Начальное направление вправо
    let nextDirection = direction;

    // Счет игры
    let score = 0;

    // Флаги управления игрой
    let gamePaused = false;
    let gameOver = false;

    // Задания (координаты заданы в процентах от размера canvas, потом переводим в "клетки")
    const tasksData = [
      {question: "She ___ (to go) to school every day.", correct: "goes", percX: 20, percY: 30},
      {question: "They ___ (to eat) dinner at 7 PM yesterday.", correct: "ate", percX: 70, percY: 50},
      {question: "I ___ (to be) very happy last week.", correct: "was", percX: 40, percY: 80},
      {question: "He ___ (to work) in the garden right now.", correct: "is working", percX: 85, percY: 20},
      {question: "We ___ (to see) that movie already.", correct: "have seen", percX: 10, percY: 60}
    ];
    // Переводим проценты в координаты клеток
    const tasks = tasksData.map(task => {
      return {
        question: task.question,
        correct: task.correct,
        x: Math.floor((task.percX / 100) * (canvas.width / cellSize)),
        y: Math.floor((task.percY / 100) * (canvas.height / cellSize)),
        done: false
      };
    });

    let currentTaskIndex = null; // Индекс текущей задачи, активной в модальном окне

    // Функция отрисовки поля, заданий и змейки
    function drawGame() {
      // Очистка canvas
      ctx.fillStyle = '#eef1f5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Рисуем задания (красные кружки)
      tasks.forEach(task => {
        if (!task.done) {
          ctx.fillStyle = 'red';
          const centerX = task.x * cellSize + cellSize / 2;
          const centerY = task.y * cellSize + cellSize / 2;
          ctx.beginPath();
          ctx.arc(centerX, centerY, cellSize / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Рисуем змейку (голова — зеленая, остальные — светло-зеленые)
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? 'green' : 'lime';
        ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize, cellSize);
      });
    }

    // Обработка клавиатурного ввода для управления направлением
    document.addEventListener('keydown', (e) => {
      if (gamePaused) return;
      switch (e.key) {
        case "ArrowUp":
          if (direction.y === 1) break;
          nextDirection = {x: 0, y: -1};
          break;
        case "ArrowDown":
          if (direction.y === -1) break;
          nextDirection = {x: 0, y: 1};
          break;
        case "ArrowLeft":
          if (direction.x === 1) break;
          nextDirection = {x: -1, y: 0};
          break;
        case "ArrowRight":
          if (direction.x === -1) break;
          nextDirection = {x: 1, y: 0};
          break;
      }
    });

    // Проверка столкновения головы змейки с заданием
    function checkTaskCollision(newHead) {
      for (let i = 0; i < tasks.length; i++) {
        let task = tasks[i];
        if (!task.done && newHead.x === task.x && newHead.y === task.y) {
          return i;
        }
      }
      return -1;
    }

    // Основной игровой цикл (вызывается через setInterval)
    function gameLoop() {
      if (gamePaused || gameOver) return;

      // Обновляем направление движения
      direction = nextDirection;

      // Вычисляем новую голову змейки
      const head = snake[0];
      const newHead = {x: head.x + direction.x, y: head.y + direction.y};

      // Обработка выхода за границы: реализована обертка по горизонтали и вертикали
      newHead.x = (newHead.x + canvas.width / cellSize) % (canvas.width / cellSize);
      newHead.y = (newHead.y + canvas.height / cellSize) % (canvas.height / cellSize);

      // Проверка на столкновение с самим собой (если голова пересекается с любым сегментом)
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
          endGame();
          return;
        }
      }

      // Добавляем новую голову в начало массива
      snake.unshift(newHead);

      // Проверяем, столкнулась ли голова с заданием
      const taskIndex = checkTaskCollision(newHead);
      if (taskIndex !== -1) {
        // При столкновении – останавливаем игру и показываем модальное окно с вопросом
        gamePaused = true;
        currentTaskIndex = taskIndex;
        showQuestion(tasks[taskIndex].question);
        // В этот ход не удаляем хвост – змейка вырастает при успешном выполнении
      } else {
        // Если столкновения не было, удаляем последний элемент (перемещение змейки)
        snake.pop();
      }

      drawGame();
    }

    // Запускаем игровой цикл
    let gameInterval = setInterval(gameLoop, gameSpeed);

    // Функции для модального окна
    function showQuestion(question) {
      questionText.textContent = question;
      userAnswer.value = '';
      resultMessage.textContent = '';
      resultMessage.style.color = '#333';
      modalBg.style.display = 'flex';
    }

    function closeModal() {
      modalBg.style.display = 'none';
      currentTaskIndex = null;
      gamePaused = false;
      if (gameOver) {
        clearInterval(gameInterval);
      }
    }

    // Обработка ответа пользователя
    function checkAnswer() {
      if (currentTaskIndex === null) return;
      const task = tasks[currentTaskIndex];
      const userAns = userAnswer.value.trim().toLowerCase();
      const correctAns = task.correct.toLowerCase();

      if (!userAns) {
        resultMessage.textContent = 'Введите ответ!';
        resultMessage.style.color = 'orange';
        return;
      }

      if (userAns === correctAns) {
        resultMessage.textContent = 'Правильно! +1 балл.';
        resultMessage.style.color = 'green';
        score++;
        scoreBoard.textContent = 'Score: ' + score;
        task.done = true;
        setTimeout(() => {
          closeModal();
          // Если все задания выполнены, завершаем игру
          if (tasks.every(t => t.done)) {
            endGame();
          }
        }, 1000);
      } else {
        resultMessage.textContent = 'Неправильно. Правильный ответ: ' + task.correct;
        resultMessage.style.color = 'red';
      }
    }

    checkBtn.addEventListener('click', checkAnswer);
    closeBtn.addEventListener('click', closeModal);

    // Завершение игры: остановка цикла, вывод финального сообщения и отправка результата в Telegram
    function endGame() {
      gameOver = true;
      gamePaused = true;
      clearInterval(gameInterval);
      questionText.textContent = "Все задания выполнены или игра окончена!";
      userAnswer.style.display = 'none';
      checkBtn.style.display = 'none';
      closeBtn.textContent = 'OK';
      resultMessage.textContent = 'Вы набрали ' + score + ' баллов!';
      resultMessage.style.color = 'blue';
      modalBg.style.display = 'flex';

      // Отправка результата через Telegram WebApp
      const resultData = { game: 'english', score: score };
      if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        Telegram.WebApp.sendData(JSON.stringify(resultData));
      }
    }
  </script>
</body>
</html>
