<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>English Snake Game</title>
  <!-- Скрипт Telegram WebApp (для работы внутри Telegram) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* Красивый градиентный фон для всей страницы */
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .score-board {
      font-size: 20px;
      margin-bottom: 10px;
      color: #fff;
    }
    /* Canvas имеет фиксированное внутреннее разрешение,
       но его CSS размеры устанавливаются динамически для адаптивности */
    #gameCanvas {
      border: 2px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    /* Стили для модального окна остаются без изменений */
    .modal-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: #fff;
      border-radius: 8px;
      width: 400px;
      max-width: 90%;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    .modal-content h2 {
      margin-bottom: 15px;
    }
    .modal-content .question-text {
      font-size: 16px;
      margin-bottom: 15px;
      min-height: 50px;
    }
    .modal-content input[type="text"] {
      width: 80%;
      padding: 8px;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .modal-content .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }
    .modal-content button {
      cursor: pointer;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      background: #007bff;
      color: #fff;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .modal-content button:hover {
      background: #0056b3;
    }
    .modal-content .result-message {
      margin-top: 10px;
      min-height: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="score-board" id="scoreBoard">Score: 0</div>
  <!-- Внутреннее разрешение canvas 800x500, а CSS размеры задаются динамически -->
  <canvas id="gameCanvas" width="800" height="500"></canvas>

  <!-- Модальное окно для вопросов -->
  <div class="modal-background" id="modalBg">
    <div class="modal-content">
      <h2>Answer the question</h2>
      <div class="question-text" id="questionText"></div>
      <input type="text" id="userAnswer" placeholder="Ваш ответ">
      <div class="result-message" id="resultMessage"></div>
      <div class="buttons">
        <button id="checkBtn">Check</button>
        <button id="closeBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Инициализация canvas с фиксированным внутренним разрешением
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const internalWidth = 800, internalHeight = 500;
    canvas.width = internalWidth;
    canvas.height = internalHeight;

    // Функция для адаптивного масштабирования canvas
    function resizeCanvas() {
      const availableWidth = window.innerWidth - 40;  // немного отступа
      const availableHeight = window.innerHeight - 150; // отступ для score board и прочего
      const aspectRatio = internalWidth / internalHeight;
      let newWidth = availableWidth;
      let newHeight = newWidth / aspectRatio;
      if (newHeight > availableHeight) {
        newHeight = availableHeight;
        newWidth = newHeight * aspectRatio;
      }
      canvas.style.width = newWidth + 'px';
      canvas.style.height = newHeight + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Элементы страницы
    const scoreBoard = document.getElementById('scoreBoard');
    const modalBg = document.getElementById('modalBg');
    const questionText = document.getElementById('questionText');
    const userAnswer = document.getElementById('userAnswer');
    const resultMessage = document.getElementById('resultMessage');
    const checkBtn = document.getElementById('checkBtn');
    const closeBtn = document.getElementById('closeBtn');

    // Настройки игры
    const cellSize = 20; // размер клетки (используется для логики змейки)
    let gameSpeed = 150; // интервал обновления игры в мс

    // Инициализация змейки (координаты в "клетках")
    let snake = [
      {x: 5, y: 5},
      {x: 4, y: 5},
      {x: 3, y: 5}
    ];
    let direction = {x: 1, y: 0}; // начальное направление — вправо
    let nextDirection = direction;
    let score = 0;
    let gamePaused = false;
    let gameOver = false;

    // Задания: координаты заданы в процентах от размера canvas, затем переводятся в "клетки"
    const tasksData = [
      {question: "She ___ (to go) to school every day.", correct: "goes", percX: 20, percY: 30},
      {question: "They ___ (to eat) dinner at 7 PM yesterday.", correct: "ate", percX: 70, percY: 50},
      {question: "I ___ (to be) very happy last week.", correct: "was", percX: 40, percY: 80},
      {question: "He ___ (to work) in the garden right now.", correct: "is working", percX: 85, percY: 20},
      {question: "We ___ (to see) that movie already.", correct: "have seen", percX: 10, percY: 60}
    ];
    const tasks = tasksData.map(task => ({
      question: task.question,
      correct: task.correct,
      x: Math.floor((task.percX / 100) * (internalWidth / cellSize)),
      y: Math.floor((task.percY / 100) * (internalHeight / cellSize)),
      done: false
    }));
    let currentTaskIndex = null;

    // Функция отрисовки игрового поля, заданий и змейки
    function drawGame() {
      // Рисуем красивый градиентный фон на canvas
      let gradient = ctx.createLinearGradient(0, 0, internalWidth, internalHeight);
      gradient.addColorStop(0, '#89f7fe');
      gradient.addColorStop(1, '#66a6ff');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, internalWidth, internalHeight);

      // Рисуем задания (красные кружки)
      tasks.forEach(task => {
        if (!task.done) {
          ctx.fillStyle = 'red';
          const centerX = task.x * cellSize + cellSize / 2;
          const centerY = task.y * cellSize + cellSize / 2;
          ctx.beginPath();
          ctx.arc(centerX, centerY, cellSize / 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Рисуем змейку (голова — зеленая, остальные — светло-зеленые)
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? 'green' : 'lime';
        ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize, cellSize);
      });
    }

    // Обработка клавиатурного ввода для управления направлением
    document.addEventListener('keydown', (e) => {
      if (gamePaused) return;
      switch (e.key) {
        case "ArrowUp":
          if (direction.y === 1) break;
          nextDirection = {x: 0, y: -1};
          break;
        case "ArrowDown":
          if (direction.y === -1) break;
          nextDirection = {x: 0, y: 1};
          break;
        case "ArrowLeft":
          if (direction.x === 1) break;
          nextDirection = {x: -1, y: 0};
          break;
        case "ArrowRight":
          if (direction.x === -1) break;
          nextDirection = {x: 1, y: 0};
          break;
      }
    });

    // Проверка столкновения головы змейки с заданием
    function checkTaskCollision(newHead) {
      for (let i = 0; i < tasks.length; i++) {
        const task = tasks[i];
        if (!task.done && newHead.x === task.x && newHead.y === task.y) {
          return i;
        }
      }
      return -1;
    }

    // Основной игровой цикл
    function gameLoop() {
      if (gamePaused || gameOver) return;

      // Обновляем направление
      direction = nextDirection;

      // Вычисляем новую голову змейки
      const head = snake[0];
      const newHead = {x: head.x + direction.x, y: head.y + direction.y};

      // Обработка выхода за границы: обёртка по горизонтали и вертикали
      newHead.x = (newHead.x + (internalWidth / cellSize)) % (internalWidth / cellSize);
      newHead.y = (newHead.y + (internalHeight / cellSize)) % (internalHeight / cellSize);

      // Проверка столкновения с самим собой
      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === newHead.x && snake[i].y === newHead.y) {
          endGame();
          return;
        }
      }

      snake.unshift(newHead);
      const taskIndex = checkTaskCollision(newHead);
      if (taskIndex !== -1) {
        // Если столкнулись с заданием — останавливаем игру и показываем вопрос
        gamePaused = true;
        currentTaskIndex = taskIndex;
        showQuestion(tasks[taskIndex].question);
      } else {
        // Если столкновения нет, убираем последний сегмент змейки (движение)
        snake.pop();
      }

      drawGame();
    }
    const gameInterval = setInterval(gameLoop, gameSpeed);

    // Функции для работы с модальным окном
    function showQuestion(question) {
      questionText.textContent = question;
      userAnswer.value = '';
      resultMessage.textContent = '';
      resultMessage.style.color = '#333';
      modalBg.style.display = 'flex';
    }
    function closeModal() {
      modalBg.style.display = 'none';
      currentTaskIndex = null;
      gamePaused = false;
      if (gameOver) {
        clearInterval(gameInterval);
      }
    }
    function checkAnswer() {
      if (currentTaskIndex === null) return;
      const task = tasks[currentTaskIndex];
      const userAns = userAnswer.value.trim().toLowerCase();
      const correctAns = task.correct.toLowerCase();
      if (!userAns) {
        resultMessage.textContent = 'Введите ответ!';
        resultMessage.style.color = 'orange';
        return;
      }
      if (userAns === correctAns) {
        resultMessage.textContent = 'Правильно! +1 балл.';
        resultMessage.style.color = 'green';
        score++;
        scoreBoard.textContent = 'Score: ' + score;
        task.done = true;
        setTimeout(() => {
          closeModal();
          if (tasks.every(t => t.done)) {
            endGame();
          }
        }, 1000);
      } else {
        resultMessage.textContent = 'Неправильно. Правильный ответ: ' + task.correct;
        resultMessage.style.color = 'red';
      }
    }
    checkBtn.addEventListener('click', checkAnswer);
    closeBtn.addEventListener('click', closeModal);

    // Завершение игры: остановка цикла, вывод финального сообщения и отправка результата в Telegram
    function endGame() {
      gameOver = true;
      gamePaused = true;
      clearInterval(gameInterval);
      questionText.textContent = "Все задания выполнены или игра окончена!";
      userAnswer.style.display = 'none';
      checkBtn.style.display = 'none';
      closeBtn.textContent = 'OK';
      resultMessage.textContent = 'Вы набрали ' + score + ' баллов!';
      resultMessage.style.color = 'blue';
      modalBg.style.display = 'flex';

      // Отправка результата через Telegram WebApp
      const resultData = { game: 'english', score: score };
      if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        Telegram.WebApp.sendData(JSON.stringify(resultData));
      }
    }
  </script>
</body>
</html>
