<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Three-in-One Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #89f7fe, #66a6ff);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    .menu-container, .game-container {
      text-align: center; padding: 20px;
      max-width: 600px; width: 100%;
    }
    .game-title { font-size: 24px; color: #fff; margin-bottom: 30px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    .game-button {
      background: #007bff; color: #fff; border: none;
      padding: 15px 30px; margin: 10px; border-radius: 25px;
      font-size: 18px; cursor: pointer; transition: .3s;
      width: 80%; max-width: 300px;
    }
    .game-button:hover { background: #0056b3; transform: translateY(-2px); }
    .exit-button {
      position: fixed; bottom: 20px; right: 20px;
      background: #dc3545; color: #fff;
      padding: 10px 20px; border-radius: 20px;
      cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .score-board {
      display: flex; gap: 15px;
      font-size: 20px; color: #fff; margin-bottom: 10px;
    }
    canvas { border: 2px solid #ccc; border-radius: 8px; }
    /* Touch controls for snake */
    .touch-controls {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 1001;   background: rgba(255,255,255,0.5); /* добавили полупрозрачный фон */
      padding: 5px; border-radius: 8px;
    }
    .touch-controls button {
      width: 50px; height: 50px; font-size: 24px;
      border-radius: 8px; opacity: 0.8; border: none;
    }
    .touch-controls button:active { opacity: 1; transform: scale(0.95); }
    /* Modal styling */
    .modal-background {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      display: none; align-items: center;
      justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: #fff; border-radius: 8px;
      width: 400px; max-width: 90%; padding: 20px;
      text-align: center; box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    .modal-content .question-text {
      font-size: 16px; margin-bottom: 15px;
    }
    .modal-content input, .modal-content button {
      font-size: 14px; padding: 8px; margin: 5px;
    }
    .modal-content button { border: none; border-radius: 4px; background: #007bff; color: #fff; }
    .modal-content button:hover { background: #0056b3; }
    .feedback { margin-top: 10px; min-height: 20px; font-weight: bold; }
    .correct { background: #28a745 !important; }
    .wrong { background: #dc3545 !important; }
    .drop-zone { display: inline-block; width: 80px; height: 30px;
      border: 2px dashed #007bff; border-radius: 5px; vertical-align: middle;
      margin: 0 5px;
    }
    .answers-container { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .answer-option {
      background: #007bff; color: #fff;
      padding: 10px 20px; border-radius: 20px;
      cursor: move; user-select: none;
    }
  </style>
</head>
<body>
  <!-- Меню выбора -->
  <div class="menu-container" id="menuContainer">
    <h1 class="game-title">Выберите задание</h1>
    <button class="game-button" onclick="startGame('snake')">🐍 Грамматическая Змейка</button>
    <button class="game-button" onclick="startGame('modal')">🃏 Модальные глаголы</button>
  </div>

  <!-- Игровой контейнер -->
  <div class="game-container" id="gameContainer" style="display:none;">
    <div class="score-board">
      <span id="scoreBoard">Score: 0</span> |
      <span id="bestScore">Best: 0</span>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="exit-button" onclick="showMenu()">Выйти в меню</div>
    <div id="touchControls" class="touch-controls">
      <button data-dir="up">↑</button>
      <button data-dir="left">←</button>
      <button data-dir="down">↓</button>
      <button data-dir="right">→</button>
    </div>
  </div>

  <!-- Модальное окно -->
  <div class="modal-background" id="modalBg">
    <div class="modal-content">
      <h2>Answer the question</h2>
      <div class="question-text" id="questionText"></div>
      <input type="text" id="userAnswer" placeholder="Ваш ответ">
      <div class="feedback" id="resultMessage"></div>
      <div>
        <button id="checkBtn">Check</button>
        <button id="closeBtn">Close</button>
      </div>
    </div>
  </div>

<script>
  // --- Common vars ---
  let currentGame = null;
  let score = 0, bestScore = 0;
  const menuContainer = document.getElementById('menuContainer');
  const gameContainer = document.getElementById('gameContainer');
  const scoreBoard = document.getElementById('scoreBoard');
  const bestBoard  = document.getElementById('bestScore');
  const canvas     = document.getElementById('gameCanvas');
  const ctx        = canvas.getContext('2d');
  const modalBg    = document.getElementById('modalBg');
  const qText      = document.getElementById('questionText');
  const uAnswer    = document.getElementById('userAnswer');
  const resMsg     = document.getElementById('resultMessage');
  const checkBtn   = document.getElementById('checkBtn');
  const closeBtn   = document.getElementById('closeBtn');

  // --- Modal Verbs Game Data & Shuffle ---
  let modalVerbsData = [
    {question: "______ you see anything in the dark room?", correct: "can", options: ["can","may"]},
    {question: "Kate ______ speak English.", correct: "can", options: ["can","may"]},
    // ... можно добавить новые
  ];
  modalVerbsData.sort(() => Math.random() - 0.5);
  let currentQuestionIndex = 0;

  // --- Helpers ---
  function updateScoreDisplay(){
    scoreBoard.textContent = `Score: ${score}`;
    bestBoard.textContent  = `Best: ${bestScore}`;
  }
  function showMenu(){
    if(confirm('Выйти в меню?')){
      clearState();
      menuContainer.style.display = 'block';
      gameContainer.style.display = 'none';
    }
  }
  function clearState(){
    score = 0; sessionStorage.removeItem('currentScore');
    updateScoreDisplay();
    if(currentGame==='snake') clearInterval(snakeInterval);
    currentQuestionIndex = 0;
    document.getElementById('modalVerbsGame')?.remove();
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  // --- Start Game ---
  function startGame(type){
    clearState();
    currentGame = type;
    menuContainer.style.display = 'none';
    gameContainer.style.display = 'flex';
    bestScore = parseInt(localStorage.getItem('bestScore'))||0;
    updateScoreDisplay();
    if(type==='snake') initSnake();
    else if(type==='modal') initModal();
  }

  // -----------------------
  //  MODAL VERBS FUNCTIONS
  // -----------------------
  function initModal(){
    renderModalQuestion();
    checkBtn.onclick = checkModalAnswer;
    closeBtn.onclick = ()=>{ modalBg.style.display='none'; };
  }
  function renderModalQuestion(){
    if(currentQuestionIndex>=modalVerbsData.length){
      endModalGame(); return;
    }
    const data = modalVerbsData[currentQuestionIndex];
    qText.innerHTML = data.question.replace('______', '<span class="drop-zone" data-correct="'+data.correct+'"></span>');
    // render options
    let opts = '';
    data.options.forEach(opt=>{
      opts+=`<div class="answer-option" draggable="true" data-value="${opt.toLowerCase()}">${opt}</div>`;
    });
    if(!document.getElementById('answersWrap')){
      const wrap = document.createElement('div');
      wrap.id='answersWrap'; wrap.className='answers-container';
      modalBg.querySelector('.modal-content').appendChild(wrap);
    }
    const wrap = document.getElementById('answersWrap');
    wrap.innerHTML = opts;
    // drag/drop handlers
    wrap.querySelectorAll('.answer-option').forEach(el=>{
      el.ondragstart = e=> e.dataTransfer.setData('text', el.dataset.value);
    });
    document.querySelector('.drop-zone').ondragover = e=>e.preventDefault();
    document.querySelector('.drop-zone').ondrop = e=>{
      e.preventDefault();
      const val = e.dataTransfer.getData('text'),
            zone = e.target;
      if(zone.children.length)return;
      const div = document.createElement('div');
      div.textContent = val;
      div.className = 'answer-option '+(val===zone.dataset.correct?'correct':'wrong');
      zone.appendChild(div);
    };
    modalBg.style.display='flex';
  }
  function checkModalAnswer(){
    const zone = document.querySelector('.drop-zone');
    if(!zone || !zone.firstChild){
      resMsg.textContent = 'Перетащите ответ!'; resMsg.style.color='orange';
      return;
    }
    const ok = zone.dataset.correct;
    const got= zone.firstChild.textContent;
    if(got===ok){
      score++; resMsg.textContent='✅ Правильно!'; resMsg.style.color='green';
      sessionStorage.setItem('currentScore', score);
      zone.style.border='solid';
      setTimeout(()=>{
        resMsg.textContent=''; modalBg.style.display='none';
        currentQuestionIndex++; renderModalQuestion();
      }, 1000);
    } else {
      resMsg.textContent=`❌ Правильно: ${ok}`; resMsg.style.color='red';
    }
    updateScoreDisplay();
  }
  function endModalGame(){
    bestScore = Math.max(bestScore, score);
    localStorage.setItem('bestScore', bestScore);
    const resultData = { game: 'modal', score: bestScore };
    if(window.Telegram?.WebApp) Telegram.WebApp.sendData(JSON.stringify(resultData));
    qText.textContent = `Игра окончена! Вы набрали ${score}/${modalVerbsData.length}.`;
    resMsg.textContent='';
    document.getElementById('answersWrap').remove();
    modalBg.style.display='flex';
  }

  // -----------------------
  //     SNAKE FUNCTIONS
  // -----------------------
  let snakeInterval, direction={x:1,y:0}, nextDirection=direction;

  function initSnake(){
    // randomize tasks
    const cellSize=20, W=canvas.width, H=canvas.height;
    const gridW=W/cellSize|0, gridH=H/cellSize|0;
    const tasksData = [
      {q:"She ___ (to go) to school every day.", a:"goes"},
      {q:"They ___ (to eat) dinner at 7 PM yesterday.", a:"ate"},
      {q:"I ___ (to be) very happy last week.", a:"was"},
      {q:"He ___ (to work) in the garden right now.", a:"is working"},
      {q:"We ___ (to see) that movie already.", a:"have seen"}
    ];
    const tasks = tasksData.map(t=>({
      question:t.q, correct:t.a,
      x: Math.floor(Math.random()*(gridW-2))+1,
      y: Math.floor(Math.random()*(gridH-2))+1,
      done:false
    }));

    let snake=[{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    let paused=false, over=false;
    updateScoreDisplay();

    // draw function
    function draw(){
      // фон
      const grad = ctx.createLinearGradient(0,0,W,H);
      grad.addColorStop(0,'#89f7fe'); grad.addColorStop(1,'#66a6ff');
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
      // точки
      tasks.forEach(t=>{
        if(!t.done){
          ctx.fillStyle='red';
          ctx.beginPath();
          ctx.arc(t.x*cellSize+cellSize/2, t.y*cellSize+cellSize/2, cellSize/2,0,2*Math.PI);
          ctx.fill();
        }
      });
      // змейка
      snake.forEach((s,i)=>{
        ctx.fillStyle = i===0?'green':'lime';
        ctx.fillRect(s.x*cellSize, s.y*cellSize, cellSize, cellSize);
      });
    }

    // управление клавишами
    document.addEventListener('keydown', e=>{
      if(paused) return;
      const key=e.key;
      if(key==='ArrowUp' && direction.y!==1)    nextDirection={x:0,y:-1};
      if(key==='ArrowDown'&& direction.y!==-1) nextDirection={x:0,y:1};
      if(key==='ArrowLeft'&& direction.x!==1)  nextDirection={x:-1,y:0};
      if(key==='ArrowRight'&&direction.x!==-1) nextDirection={x:1,y:0};
    });
    // on-screen buttons
    document.querySelectorAll('#touchControls button').forEach(btn=>{
      btn.addEventListener('touchstart', e=>{
        e.preventDefault();
        const d=btn.dataset.dir;
        if(d==='up'&&direction.y!==1) nextDirection={x:0,y:-1};
        if(d==='down'&&direction.y!==-1) nextDirection={x:0,y:1};
        if(d==='left'&&direction.x!==1) nextDirection={x:-1,y:0};
        if(d==='right'&&direction.x!==-1) nextDirection={x:1,y:0};
      });
    });
    // swipe
    let sx,sy;
    canvas.addEventListener('touchstart', e=>{
      sx=e.changedTouches[0].clientX; sy=e.changedTouches[0].clientY;
    });
    canvas.addEventListener('touchend', e=>{
      const dx=e.changedTouches[0].clientX-sx,
            dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>30||Math.abs(dy)>30){
        if(Math.abs(dx)>Math.abs(dy)){
          if(dx>0&&direction.x!==-1) nextDirection={x:1,y:0};
          else if(dx<0&&direction.x!==1) nextDirection={x:-1,y:0};
        } else {
          if(dy>0&&direction.y!==-1) nextDirection={x:0,y:1};
          else if(dy<0&&direction.y!==1) nextDirection={x:0,y:-1};
        }
      }
    });

    function checkCollision(head){
      return tasks.findIndex(t=>!t.done && t.x===head.x && t.y===head.y);
    }
    function gameLoop(){
      if(paused||over) return;
      direction = nextDirection;
      const head = {x:snake[0].x+direction.x, y:snake[0].y+direction.y};
      head.x = (head.x+gridW)%gridW;
      head.y = (head.y+gridH)%gridH;
      // самопересечение
      if(snake.some(s=>s.x===head.x && s.y===head.y)){
        endSnake(); return;
      }
      snake.unshift(head);
      const idx = checkCollision(head);
      if(idx>=0){
        paused = true;
        // показываем вопрос
        qText.textContent = tasks[idx].question;
        modalBg.style.display='flex';
        checkBtn.onclick = ()=>{
          const ans = uAnswer.value.trim().toLowerCase();
          if(!ans){ resMsg.textContent='Введите ответ!'; resMsg.style.color='orange'; return; }
          if(ans===tasks[idx].correct.toLowerCase()){
            resMsg.textContent='✅ Правильно!'; resMsg.style.color='green';
            score++; updateScoreDisplay();
            tasks[idx].done = true;
            sessionStorage.setItem('currentScore', score);
            setTimeout(()=>{
              uAnswer.value=''; resMsg.textContent=''; modalBg.style.display='none';
              paused = false;
              if(tasks.every(t=>t.done)) endSnake();
            }, 1000);
          } else {
            resMsg.textContent='❌ Неправильно! Правильный: '+tasks[idx].correct;
            resMsg.style.color='red';
          }
        };
      } else {
        snake.pop();
      }
      draw();
    }

    function endSnake(){
      over = true; paused = true; clearInterval(snakeInterval);
      bestScore = Math.max(bestScore, score);
      localStorage.setItem('bestScore', bestScore);
      resMsg.textContent = 'Вы набрали '+score+' очков!';
      resMsg.style.color='blue';
      modalBg.style.display='flex';
      const resultData = { game:'snake', score: bestScore };
      if(window.Telegram?.WebApp) Telegram.WebApp.sendData(JSON.stringify(resultData));
    }

    snakeInterval = setInterval(gameLoop, 150);
  }
</script>
</body>
</html>
